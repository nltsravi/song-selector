name: Build & Deploy Hybrid Mobile App (Android & iOS) & Static Web SPA

on:
  push:
    branches: [ main, feature/song-selector-spa, feature/mobile-app ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21 for Android Hybrid Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Auth Config from Git Variables & Secrets
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          AUTHORIZED_EMAIL_IDS: ${{ vars.AUTHORIZED_EMAIL_IDS || secrets.AUTHORIZED_EMAIL_IDS || vars.AUTHORIZED_USERS || secrets.AUTHORIZED_USERS || secrets.AUTHORIZED_EMAILS }}
          ALLOWED_DOMAIN: ${{ vars.ALLOWED_DOMAIN || secrets.ALLOWED_DOMAIN }}
        run: |
          node scripts/build-auth-config.js

      - name: Sync Web Assets to Android & iOS Hybrid Projects
        run: |
          npx cap copy
          npx cap update android

      - name: Run All Test Suites (Backend, Static SPA, Google OAuth & Mobile Hybrid)
        run: |
          npm test

      - name: Build Production Play Store AAB & Android APKs (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease assembleDebug

      - name: Upload Production Google Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongSelector-PlayStore-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android Release & Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SongSelector-Android-APKs
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload iOS Hybrid Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SongSelector-iOS-Xcode-Project
          path: ios/
          if-no-files-found: warn

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true

      - name: Upload Static Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/song-selector-spa' || github.ref == 'refs/heads/feature/mobile-app'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
