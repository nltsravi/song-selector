name: Release & Publish Android App to Google Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-play-store:
    name: Build & Publish R8-Deobfuscated AAB to All Play Store Tracks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Auth Config & Sync Capacitor Android Assets
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          AUTHORIZED_EMAIL_IDS: ${{ vars.AUTHORIZED_EMAIL_IDS || secrets.AUTHORIZED_EMAIL_IDS }}
          ALLOWED_DOMAIN: ${{ vars.ALLOWED_DOMAIN || secrets.ALLOWED_DOMAIN }}
        run: |
          node scripts/build-auth-config.js
          npx cap sync android

      - name: Decode Release Keystore & Play Store Service Account JSON
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          else
            cp android/app/upload-keystore.jks android/app/release-keystore.jks
          fi

          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > android/app/play-service-account.json
          fi

      - name: Build Signed Production Release AAB (with R8 Deobfuscation Mapping)
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: play-service-account.json
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export VERSION_CODE=$((200 + ${{ github.run_number }} * 10 + ${{ github.run_attempt }} * 4))
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep proguard.map

      - name: Upload Release AAB & R8 Deobfuscation Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SongSelector-PlayStore-Release-AAB-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish to Google Play Store — Internal, Closed (Alpha), Open (Beta) & Production Tracks
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: play-service-account.json
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          cd android
          BASE_VC=$((200 + ${{ github.run_number }} * 10 + ${{ github.run_attempt }} * 4))

          SUCCESS_COUNT=0
          FAILED_TRACKS=""
          OFFSET=1
          for TRACK in internal alpha beta production; do
            export VERSION_CODE=$((BASE_VC + OFFSET))
            export PLAY_TRACK="$TRACK"
            rm -rf build/gpp app/build/gpp
            echo "================================================================"
            echo "Publishing R8-obfuscated AAB + mapping.txt to track: $TRACK (versionCode=$VERSION_CODE)"
            echo "================================================================"
            if ./gradlew publishReleaseBundle --track "$TRACK" --rerun --no-daemon; then
              echo "✅ Successfully published versionCode=$VERSION_CODE to track: $TRACK"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "::warning::Failed to publish to track '$TRACK' (check Service Account track permissions in Google Play Console -> Users and permissions)."
              FAILED_TRACKS="$FAILED_TRACKS $TRACK"
            fi
            OFFSET=$((OFFSET + 1))
          done

          echo "================================================================"
          echo "Play Store Publish Summary: $SUCCESS_COUNT/4 tracks succeeded."
          if [ -n "$FAILED_TRACKS" ]; then
            echo "Tracks skipped/failed:$FAILED_TRACKS"
          fi
          echo "================================================================"

          if [ "$SUCCESS_COUNT" -eq 0 ]; then
            echo "::error::All 4 Play Store tracks failed. Ensure the Service Account in Google Play Console -> Users and permissions has 'Admin (all permissions)' or all 'Releases' permissions enabled."
            exit 1
          fi

      - name: Clean Up Sensitive Credentials
        if: always()
        run: |
          rm -f android/app/release-keystore.jks android/app/play-service-account.json
